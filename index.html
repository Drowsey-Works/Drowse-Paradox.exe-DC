<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Classified: 2020x Database</title>
  <link rel="icon" type="image/jpeg" href="https://github.com/Drowsey-Works/Drowse-Paradox.exe-DC/blob/main/imgs/CreamLogo.jpg?raw=true">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
</head>
<body>

  <!-- The Desk Top -->
  <div class="desk-surface">
    
    <!-- Header / Search -->
    <header class="top-bar">
      <div class="classified-stamp">TOP SECRET</div>
      <div class="searchbar">
        <input placeholder="Search files..." id="searchInp">
        <div id="searchBtn" class="fas fa-search"></div>
      </div>
      <div class="navItems fas fa-folder-open" id="navItemBtn"></div>
    </header>

    <!-- The Folder Grid -->
    <main>
      <div id="folderContainer" class="folder-grid">
        <!-- Folders generated by JS -->
      </div>
    </main>

    <!-- The Opened File Overlay -->
    <div id="filePanel" class="file-panel">
      <div class="file-panel-inner">
        <button id="closeView" class="close-btn"><i class="fas fa-times"></i> CLOSE FILE</button>
        <div id="viewDetails" class="file-content"></div>
      </div>
    </div>

  </div>

  <script src="character-data.js"></script>
  <script src="ability-data.js"></script>
  <script src="display-characters.js"></script>
</body>
</html>
