<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>THE ARCHIVE</title>
  <link rel="icon" type="image/jpeg" href="https://github.com/Drowsey-Works/Drowse-Paradox.exe-DC/blob/main/imgs/CreamLogo.jpg?raw=true">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
</head>
<body>

  <!-- The Desk -->
  <div class="desk" id="desk">
    <div class="desk-lamp"></div>
    <div class="desk-vignette"></div>

    <!-- Index Card: Names Grid -->
    <div class="index-card" id="indexCard">
      <div class="index-header">
        <span>FILE INDEX</span>
        <span class="index-counter" id="indexCounter">0 ENTRIES</span>
      </div>
      <div class="index-grid" id="indexGrid"></div>
    </div>

    <!-- The Folder Slot: single folder that slides in -->
    <div class="folder-slot" id="folderSlot">
      <div class="desk-folder" id="chosenFolder">
        <div class="folder-tab">FILE</div>

        <!-- The Front Cover — this is the half that swings open -->
        <div class="folder-front">
          <div class="folder-icon"><i class="fas fa-folder"></i></div>
          <span class="folder-name" id="chosenFolderName">NAME</span>
          <div class="folder-stamp">TOP SECRET</div>
        </div>

        <!-- The Inside — the back half, lying flat on the desk -->
        <div class="folder-inside">
          <div class="paper-document">DECLASSIFIED INTEL</div>
        </div>

      </div>
      <button class="back-to-index" id="backToIndex">
        <i class="fas fa-arrow-left"></i> BACK TO INDEX
      </button>
    </div>

    <!-- The Opened File Overlay -->
    <div class="file-panel" id="filePanel">
      <div class="file-panel-inner">
        <button id="closeView" class="close-btn"><i class="fas fa-times"></i> CLOSE FILE</button>
        <div id="viewDetails" class="file-content"></div>
      </div>
    </div>
  </div>

  <!-- Dialogue Box -->
  <div class="dialogue-overlay" id="dialogueOverlay">
    <div class="dialogue-box">
      <div class="dialogue-speaker">
        <span class="speaker-icon">📁</span> THE ARCHIVIST
      </div>
      <div class="dialogue-text" id="dialogueText"></div>
      <div class="dialogue-arrow" id="dialogueArrow">▼</div>
      <div class="dialogue-choices" id="dialogueChoices"></div>
    </div>
  </div>

  <script src="character-data.js"></script>
  <script src="ability-data.js"></script>
  <script src="dialogue-system.js"></script>
  <script src="display-characters.js"></script>
</body>
</html>
