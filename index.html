<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>THE ARCHIVE</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
  
  <!-- Import Three.js and Addons via ES Modules -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- The 3D Room -->
  <canvas id="webgl-canvas"></canvas>

  <!-- HTML UI Overlay -->
  <div class="ui-layer">
    
    <!-- Index Card (Names) -->
    <div class="index-card" id="indexCard">
      <div class="index-header">
        <span>FILE INDEX</span>
        <span class="index-counter" id="indexCounter">0 ENTRIES</span>
      </div>
      <div class="index-grid" id="indexGrid"></div>
    </div>

    <!-- The Opened File (Dossier) -->
    <div class="file-panel" id="filePanel">
      <div class="file-panel-inner">
        <button id="closeView" class="close-btn"><i class="fas fa-times"></i> CLOSE FILE</button>
        <div id="viewDetails" class="file-content"></div>
      </div>
    </div>

    <!-- Dialogue Box -->
    <div class="dialogue-overlay" id="dialogueOverlay">
      <div class="dialogue-box">
        <div class="dialogue-speaker"><span class="speaker-icon">📁</span> THE ARCHIVIST</div>
        <div class="dialogue-text" id="dialogueText"></div>
        <div class="dialogue-arrow" id="dialogueArrow">▼</div>
        <div class="dialogue-choices" id="dialogueChoices"></div>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="character-data.js"></script>
  <script src="ability-data.js"></script>
  <script src="dialogue-system.js"></script>
  <script src="three-scene.js" type="module"></script> <!-- New 3D File -->
  <script src="display-characters.js"></script>
</body>
</html>
