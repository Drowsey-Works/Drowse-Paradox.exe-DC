<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>THE ARCHIVE</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>

  <div class="ui-layer">
    <!-- Switch Side Button (Floats top right) -->
    <button class="switch-side-btn" id="switchSideBtn" style="display: none;">
        <i class="fas fa-sync-alt"></i> SWITCH SIDE
    </button>

    <!-- The Opened File (Dossier) -->
    <div class="file-panel" id="filePanel">
      <div class="file-panel-inner">
        <button id="closeView" class="close-btn"><i class="fas fa-times"></i> CLOSE FILE</button>
        <div id="viewDetails" class="file-content"></div>
      </div>
    </div>

    <!-- Dialogue Box -->
    <div class="dialogue-overlay" id="dialogueOverlay">
      <div class="dialogue-box">
        <div class="dialogue-speaker"><span class="speaker-icon">📁</span> THE ARCHIVIST</div>
        <div class="dialogue-text" id="dialogueText"></div>
        <div class="dialogue-arrow" id="dialogueArrow">▼</div>
        <div class="dialogue-choices" id="dialogueChoices"></div>
      </div>
    </div>
  </div>

  <script src="character-data.js"></script>
  <script src="ability-data.js"></script>
  <script src="dialogue-system.js"></script>
  <script src="three-scene.js" type="module"></script>
  <script src="display-characters.js"></script>
</body>
</html>
